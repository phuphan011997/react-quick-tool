        // Helper to parse dates in various formats (Vietnam standard e.g. 12/05/2026 to ISO YYYY-MM-DD)
        const parseDateInput = (str) => {
            if (!str) return '';
            str = str.trim();
            // Match DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
            const dmyRegex = /^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})$/;
            const matchDmy = str.match(dmyRegex);
            if (matchDmy) {
                const day = matchDmy[1].padStart(2, '0');
                const month = matchDmy[2].padStart(2, '0');
                const year = matchDmy[3];
                return `${year}-${month}-${day}`;
            }
            // Match YYYY/MM/DD or YYYY-MM-DD
            const ymdRegex = /^(\d{4})[\/\.-](\d{1,2})[\/\.-](\d{1,2})$/;
            const matchYmd = str.match(ymdRegex);
            if (matchYmd) {
                const year = matchYmd[1];
                const month = matchYmd[2].padStart(2, '0');
                const day = matchYmd[3].padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            return str;
        };

        function App() {

            const [apiToken, setApiToken] = useState('');

            );
            const [useCorsProxy, setUseCorsProxy] = useState(false);
            const [corsProxyUrl, setCorsProxyUrl] = useState('https://cors-anywhere.herokuapp.com/');

            // Active Navigation Tab
            const [activeTab, setActiveTab] = useState('batch'); // default to 'batch' (as requested) | 'automation' | 'manual-parser' | 'settings' | 'update-gr'

            // --- SINGLE MODE STATES ---
            const [invoiceDate, setInvoiceDate] = useState('2026-05-28');
            const [poNumberInput, setPoNumberInput] = useState('PO-STG0004078');
            const [storeId, setStoreId] = useState('3354');
            const [stockId, setStockId] = useState('');
            const [stocksList, setStocksList] = useState([]);
            const [isLoadingStocks, setIsLoadingStocks] = useState(false);
            const [movementTypeId, setMovementTypeId] = useState('5');
            const [inputType, setInputType] = useState('22');
            const [notes, setNotes] = useState('');
            const [currentStep, setCurrentStep] = useState(0);
            const [stepLogs, setStepLogs] = useState([]);
            const [foundPoId, setFoundPoId] = useState(null);
            const [poDetailRaw, setPoDetailRaw] = useState(null);
            const [generatedPayload, setGeneratedPayload] = useState(null);
            const [responseResult, setResponseResult] = useState(null);

            // --- BATCH MODE STATES ---
            const [batchInputText, setBatchInputText] = useState(
                `PO-STG0004078\t12/05/2026\nPO-STG0004078\t13/05/2026`
            );
            const [batchTasks, setBatchTasks] = useState([]);
            const [isBatchRunning, setIsBatchRunning] = useState(false);
            const [batchDelay, setBatchDelay] = useState(1000); // 1s delay default
            const [selectedBatchTaskIndex, setSelectedBatchTaskIndex] = useState(null);
            const batchRunningRef = useRef(false);

            // Manual Mode state
            const [manualPoJson, setManualPoJson] = useState('');
            const [manualResultJson, setManualResultJson] = useState('');

            // --- UPDATE GR BATCH STATES ---
            const [updateGrBatchText, setUpdateGrBatchText] = useState('148356\t12/05/2026\n148357\t13/05/2026');
            const [updateGrTasks, setUpdateGrTasks] = useState([]);
            const [isUpdateGrBatchRunning, setIsUpdateGrBatchRunning] = useState(false);
            const [updateGrDelay, setUpdateGrDelay] = useState(1000);
            const [selectedUpdateGrTaskIndex, setSelectedUpdateGrTaskIndex] = useState(null);
            const updateGrRunningRef = useRef(false);

            const addLog = (msg, type = 'info') => {
                const time = new Date().toLocaleTimeString();
                setStepLogs(prev => [...prev, { timestamp: time, message: msg, type }]);
            };

            const handleParseUpdateGrBatch = () => {
                if (!updateGrBatchText.trim()) {
                    showNotify("Vui lòng nhập danh sách dữ liệu!", "error");
                    return;
                }
                const lines = updateGrBatchText.split('\n');
                const parsedTasks = [];

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const parts = line.split(/\t|,|\s{2,}/);
                    const grId = parts[0] ? parts[0].trim() : '';
                    let rawDate = parts[1] ? parts[1].trim() : '';
                    
                    if (!rawDate) {
                        const today = new Date();
                        rawDate = today.toLocaleDateString('vi-VN');
                    }
                    
                    const normalizedDate = parseDateInput(rawDate);

                    if (grId) {
                        parsedTasks.push({
                            id: index + 1,
                            grId: grId,
                            docDate: normalizedDate,
                            originalDateText: rawDate,
                            status: 'pending',
                            progressStep: 'Sẵn sàng',
                            message: '',
                            payload: null,
                            result: null
                        });
                    }
                });

                if (parsedTasks.length > 0) {
                    setUpdateGrTasks(parsedTasks);
                    setSelectedUpdateGrTaskIndex(0);
                    showNotify(`Đã phân tích ${parsedTasks.length} GR cần cập nhật!`, "success");
                } else {
                    showNotify("Không phát hiện dữ liệu hợp lệ.", "error");
                }
            };

            const stopUpdateGrBatch = () => {
                updateGrRunningRef.current = false;
                setIsUpdateGrBatchRunning(false);
                showNotify("Đã yêu cầu dừng xử lý.", "info");
            };

            const runUpdateGrBatch = async () => {
                if (updateGrTasks.length === 0) {
                    showNotify("Vui lòng nạp danh sách GR trước!", "error");
                    return;
                }
                if (isUpdateGrBatchRunning) return;

                const headers = parseHeaders();
                setIsUpdateGrBatchRunning(true);
                updateGrRunningRef.current = true;

                const tasksCopy = [...updateGrTasks];

                for (let i = 0; i < tasksCopy.length; i++) {
                    if (!updateGrRunningRef.current) break;
                    if (tasksCopy[i].status === 'success') continue;

                    tasksCopy[i].status = 'processing';
                    tasksCopy[i].progressStep = 'Đang tải GR...';
                    setUpdateGrTasks([...tasksCopy]);
                    setSelectedUpdateGrTaskIndex(i);

                    try {
                        const currentTask = tasksCopy[i];
                        
                        // 1. GET GR info
                        const getUrl = `${baseUrl}/goods-receipts/${currentTask.grId}?orgId=${orgId}&lang=${lang}&v=${version}`;
                        const getRes = await fetch(getProxyUrl(getUrl), { method: 'GET', headers });
                        if (!getRes.ok) throw new Error(`Lỗi khi lấy thông tin GR (Status: ${getRes.status})`);
                        
                        const getJson = await getRes.json();
                        if (getJson.success === false) throw new Error(`Lỗi từ API: ${getJson.message}`);
                        
                        const grData = getJson.data || getJson;
                        if (!grData || !grData.id) throw new Error(`Không tìm thấy dữ liệu Phiếu Nhập`);

                        tasksCopy[i].progressStep = 'Đang cập nhật...';
                        setUpdateGrTasks([...tasksCopy]);

                        // 2. Modify docDate
                        const updatedPayload = {
                            ...grData,
                            docDate: currentTask.docDate
                        };
                        currentTask.payload = updatedPayload;

                        // 3. PUT updated GR
                        const putUrl = `${baseUrl}/goods-receipts?orgId=${orgId}&lang=${lang}&v=${version}`;
                        const putRes = await fetch(getProxyUrl(putUrl), {
                            method: 'PUT',
                            headers: { ...headers, 'content-type': 'application/json' },
                            body: JSON.stringify(updatedPayload)
                        });

                        let putJson;
                        try { putJson = await putRes.json(); } catch(e) { putJson = { success: putRes.ok }; }
                        currentTask.result = putJson;

                        if (putRes.ok && putJson.success !== false) {
                            tasksCopy[i].status = 'success';
                            tasksCopy[i].progressStep = 'Hoàn thành!';
                            tasksCopy[i].message = `Cập nhật thành công docDate thành ${currentTask.docDate}`;
                        } else {
                            throw new Error(`Cập nhật thất bại: ${putJson.message || 'Lỗi không xác định'}`);
                        }

                    } catch (err) {
                        tasksCopy[i].status = 'failed';
                        tasksCopy[i].progressStep = 'Lỗi!';
                        tasksCopy[i].message = err.message;
                    }

                    setUpdateGrTasks([...tasksCopy]);

                    if (i < tasksCopy.length - 1 && updateGrRunningRef.current) {
                        await new Promise(resolve => setTimeout(resolve, updateGrDelay));
                    }
                }

                setIsUpdateGrBatchRunning(false);
                updateGrRunningRef.current = false;
                showNotify("Quá trình cập nhật hoàn tất!", "success");
            };

            // Notifications
            const [notification, setNotification] = useState(null);
            const showNotify = (message, type = 'info') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const parseHeaders = () => {
                const headers = {};
                customHeadersText.split('\n').forEach(line => {
                    const colonIndex = line.indexOf(':');
                    if (colonIndex > -1) {
                        const key = line.substring(0, colonIndex).trim();
                        const value = line.substring(colonIndex + 1).trim();
                        if (key) headers[key] = value;
                    }
                });
                if (apiToken.trim()) {
                    let cleanedToken = apiToken.trim();
                    const actualToken = cleanedToken.toLowerCase().startsWith('bearer ') 
                        ? cleanedToken.substring(7).trim() 
                        : cleanedToken;
                    headers['Authorization'] = `Bearer ${actualToken}`;
                    headers['token'] = actualToken;
                }
                return headers;
            };

            const getProxyUrl = (url) => {
                if (useCorsProxy) {
                    return `${corsProxyUrl.trim()}${url}`;
                }
                return url;
            };

            // Parse Batch Paste Area
            const handleParseBatchInput = () => {
                if (!batchInputText.trim()) {
                    showNotify("Vui lòng nhập danh sách dữ liệu!", "error");
                    return;
                }
                const lines = batchInputText.split('\n');
                const parsedTasks = [];

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    // Split by tab, comma, or multiple spaces
                    const parts = line.split(/\t|,|\s{2,}/);
                    const po = parts[0] ? parts[0].trim() : '';
                    let rawDate = parts[1] ? parts[1].trim() : '';
                    
                    // Fallback to current date if missing
                    if (!rawDate) {
                        const today = new Date();
                        rawDate = today.toLocaleDateString('vi-VN');
                    }
                    
                    const normalizedDate = parseDateInput(rawDate);

                    if (po) {
                        parsedTasks.push({
                            id: index + 1,
                            poNumber: po,
                            invoiceDate: normalizedDate,
                            originalDateText: rawDate,
                            status: 'pending', // pending, processing, success, failed
                            progressStep: 'Sẵn sàng',
                            message: '',
                            poId: null,
                            grPayload: null,
                            grResult: null
                        });
                    }
                });

                if (parsedTasks.length > 0) {
                    setBatchTasks(parsedTasks);
                    setSelectedBatchTaskIndex(0);
                    showNotify(`Đã phân tích thành công ${parsedTasks.length} đơn PO hàng loạt!`, "success");
                } else {
                    showNotify("Không phát hiện dữ liệu hợp lệ. Đảm bảo phân tách cột bằng Tab hoặc khoảng cách lớn.", "error");
                }
            };

            // Stop/Pause Batch execution
            const stopBatchExecution = () => {
                batchRunningRef.current = false;
                setIsBatchRunning(false);
                showNotify("Đã yêu cầu tạm dừng tiến trình xử lý hàng loạt.", "info");
            };

            // Run Batch processing sequentially
            const runBatchProcessing = async () => {
                if (batchTasks.length === 0) {
                    showNotify("Vui lòng nạp danh sách PO trước!", "error");
                    return;
                }
                if (isBatchRunning) return;

                const headers = parseHeaders();
                if (!headers['Authorization'] && !apiToken.trim()) {
                    showNotify("Hãy điền Token Xác Thực trước khi chạy hàng loạt!", "error");
                    setActiveTab('settings');
                    return;
                }

                setIsBatchRunning(true);
                batchRunningRef.current = true;

                // Create a copy of tasks to manipulate and update state live
                const tasksCopy = [...batchTasks];

                for (let i = 0; i < tasksCopy.length; i++) {
                    if (!batchRunningRef.current) {
                        break; // Stop requested
                    }

                    // Skip tasks already successful
                    if (tasksCopy[i].status === 'success') {
                        continue;
                    }

                    tasksCopy[i].status = 'processing';
                    tasksCopy[i].progressStep = 'Đang tra cứu PO...';
                    setBatchTasks([...tasksCopy]);
                    setSelectedBatchTaskIndex(i);

                    try {
                        const currentTask = tasksCopy[i];

                        // ---- STEP 1: Search PO ----
                        const searchUrl = `${baseUrl}/purchase-orders?orgId=${orgId}&search=${encodeURIComponent(currentTask.poNumber)}&orderBy=id%20desc&limit=5&offset=0&lang=${lang}&v=${version}`;
                        const searchRes = await fetch(getProxyUrl(searchUrl), { method: 'GET', headers });

                        if (!searchRes.ok) {
                            throw new Error(`[B1] Không tra cứu được PO. Status: ${searchRes.status}`);
                        }

                        const searchData = await searchRes.json();
                        if (searchData.success === false) {
                            throw new Error(`[B1] API tìm PO báo lỗi: ${searchData.message}`);
                        }

                        let records = [];
                        if (searchData.data && Array.isArray(searchData.data.records)) {
                            records = searchData.data.records;
                        } else if (Array.isArray(searchData.data)) {
                            records = searchData.data;
                        } else if (searchData.records && Array.isArray(searchData.records)) {
                            records = searchData.records;
                        }

                        const foundPo = records.find(po => po.docNumber === currentTask.poNumber || po.docCode === currentTask.poNumber) || records[0];

                        if (!foundPo || !foundPo.id) {
                            throw new Error(`[B1] Không tìm thấy PO tương ứng trên hệ thống.`);
                        }

                        const poId = foundPo.id;
                        const activeStoreId = foundPo.storeId || 3354;
                        currentTask.poId = poId;

                        // ---- STEP 2: Fetch Details ----
                        tasksCopy[i].progressStep = 'Đang tải chi tiết sản phẩm...';
                        setBatchTasks([...tasksCopy]);

                        const detailsUrl = `${baseUrl}/purchase-orders/${poId}?orgId=${orgId}&lang=${lang}&v=${version}`;
                        const detailsRes = await fetch(getProxyUrl(detailsUrl), { method: 'GET', headers });

                        if (!detailsRes.ok) {
                            throw new Error(`[B2] Không tải được chi tiết PO ID: ${poId}`);
                        }

                        const poDetail = await detailsRes.json();
                        const poData = poDetail.data || poDetail;

                        // ---- STEP 3: Fetch dynamic stocks ----
                        tasksCopy[i].progressStep = 'Đang quét kho cửa hàng...';
                        setBatchTasks([...tasksCopy]);

                        const stocksUrl = `${baseUrl}/stocks?orgId=${orgId}&storeId=${activeStoreId}&orderBy=id%20desc&limit=1000&offset=0&lang=${lang}&v=${version}`;
                        const stocksRes = await fetch(getProxyUrl(stocksUrl), { method: 'GET', headers });

                        let resolvedStockId = 2; // mặc định nếu lỗi
                        if (stocksRes.ok) {
                            const stocksData = await stocksRes.json();
                            const recs = stocksData.data?.records || stocksData.data || stocksData || [];
                            if (recs.length > 0) {
                                resolvedStockId = recs[0].id;
                            }
                        }

                        // Map Items
                        const poItems = poData.items || [];
                        const mappedItems = poItems.map(item => ({
                            id: item.id,
                            productId: item.productId,
                            productName: item.productName || item.product?.name || "Sản phẩm",
                            unitId: item.unitId || item.unit?.id || 18,
                            unitName: item.unitName || item.unit?.name || 'Đơn vị',
                            quantity: item.quantity || item.orderQuantity || 0,
                            sku: item.sku || item.product?.sku || '',
                            orderQuantity: item.orderQuantity || item.quantity || 0
                        }));

                        // Build Payload
                        const payload = {
                            organizationId: parseInt(orgId),
                            storeId: activeStoreId,
                            movementTypeId: parseInt(movementTypeId),
                            docDate: currentTask.invoiceDate,
                            docNumber: "",
                            supplierId: poData.supplierId || 187,
                            stockId: parseInt(resolvedStockId),
                            docStatus: 1,
                            notes: `Hàng loạt: Tạo tự động cho PO ${currentTask.poNumber}`,
                            items: mappedItems,
                            docRefs: [
                                {
                                    docId: poId,
                                    docType: "PurchaseOrder",
                                    docTypeId: 22,
                                    docNumber: poData.docNumber || currentTask.poNumber
                                }
                            ],
                            inputType: parseInt(inputType),
                            idempotencyKey: crypto.randomUUID()
                        };

                        currentTask.grPayload = payload;

                        // ---- STEP 4: Submit Goods Receipt ----
                        tasksCopy[i].progressStep = 'Đang nộp phiếu nhập hàng...';
                        setBatchTasks([...tasksCopy]);

                        const postUrl = `${baseUrl}/goods-receipts?orgId=${orgId}&lang=${lang}&v=${version}`;
                        const response = await fetch(getProxyUrl(postUrl), {
                            method: 'POST',
                            headers: {
                                ...headers,
                                'content-type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        const resText = await response.text();
                        let resJson;
                        try { resJson = JSON.parse(resText); } catch (e) { resJson = resText; }

                        currentTask.grResult = resJson;

                        if (response.ok && resJson.success !== false) {
                            tasksCopy[i].status = 'success';
                            tasksCopy[i].progressStep = 'Hoàn thành!';
                            tasksCopy[i].message = `Tạo GR thành công! (ID: ${resJson.data?.id || 'OK'})`;
                        } else {
                            throw new Error(`[B4] Server từ chối: ${resJson.message || 'Lỗi không xác định'}`);
                        }

                    } catch (err) {
                        tasksCopy[i].status = 'failed';
                        tasksCopy[i].progressStep = 'Lỗi!';
                        tasksCopy[i].message = err.message;
                    }

                    setBatchTasks([...tasksCopy]);

                    // Delay between iterations to prevent server hammering
                    if (i < tasksCopy.length - 1 && batchRunningRef.current) {
                        await new Promise(resolve => setTimeout(resolve, batchDelay));
                    }
                }

                setIsBatchRunning(false);
                batchRunningRef.current = false;
                showNotify("Quá trình xử lý hàng loạt hoàn tất!", "success");
            };


            // --- SINGLE MODE API LOGIC ---
            const fetchStocksByStore = async (targetStoreId, headersObj) => {
                setIsLoadingStocks(true);
                addLog(`[Bước 2.5] Đang tải danh sách Kho của cửa hàng ${targetStoreId}...`, 'info');
                try {
                    const stocksUrl = `${baseUrl}/stocks?orgId=${orgId}&storeId=${targetStoreId}&orderBy=id%20desc&limit=1000&offset=0&lang=${lang}&v=${version}`;
                    const stocksRes = await fetch(getProxyUrl(stocksUrl), {
                        method: 'GET',
                        headers: headersObj || parseHeaders()
                    });

                    if (stocksRes.ok) {
                        const stocksData = await stocksRes.json();
                        let fetchedStocks = [];
                        
                        if (stocksData.data && Array.isArray(stocksData.data.records)) {
                            fetchedStocks = stocksData.data.records;
                        } else if (Array.isArray(stocksData.data)) {
                            fetchedStocks = stocksData.data;
                        }

                        setStocksList(fetchedStocks);
                        
                        if (fetchedStocks.length > 0) {
                            const defaultStockId = fetchedStocks[0].id.toString();
                            setStockId(defaultStockId);
                            addLog(`Tải kho thành công! Tìm thấy ${fetchedStocks.length} kho. Kho mặc định: "${fetchedStocks[0].name}" (ID: ${defaultStockId})`, 'success');
                            return defaultStockId;
                        } else {
                            addLog(`Không tìm thấy kho cho Store ${targetStoreId}.`, 'warning');
                        }
                    }
                } catch (err) {
                    addLog(`Gặp lỗi khi tải danh sách kho: ${err.message}`, 'error');
                } finally {
                    setIsLoadingStocks(false);
                }
                return '';
            };

            const runSingleAutomation = async () => {
                setStepLogs([]);
                setResponseResult(null);
                setFoundPoId(null);
                setPoDetailRaw(null);
                setGeneratedPayload(null);
                setCurrentStep(1);

                addLog(`Bắt đầu xử lý đơn lẻ cho PO: ${poNumberInput}`, 'info');

                try {
                    const headers = parseHeaders();
                    addLog(`[Bước 1] Tra cứu mã PO...`, 'info');
                    const searchUrl = `${baseUrl}/purchase-orders?orgId=${orgId}&search=${encodeURIComponent(poNumberInput)}&orderBy=id%20desc&limit=5&offset=0&lang=${lang}&v=${version}`;
                    const searchRes = await fetch(getProxyUrl(searchUrl), { method: 'GET', headers });

                    if (!searchRes.ok) throw new Error(`Tra cứu PO thất bại.`);
                    const searchData = await searchRes.json();
                    
                    let records = [];
                    if (searchData.data && Array.isArray(searchData.data.records)) {
                        records = searchData.data.records;
                    }

                    const finalPo = records.find(po => po.docNumber === poNumberInput || po.docCode === poNumberInput) || records[0];
                    if (!finalPo || !finalPo.id) throw new Error(`Không tìm thấy PO.`);

                    const poId = finalPo.id;
                    setFoundPoId(poId);
                    setStoreId(finalPo.storeId?.toString() || storeId);

                    setCurrentStep(2);
                    addLog(`[Bước 2] Tải chi tiết PO ID ${poId}...`, 'info');
                    const detailsUrl = `${baseUrl}/purchase-orders/${poId}?orgId=${orgId}&lang=${lang}&v=${version}`;
                    const detailsRes = await fetch(getProxyUrl(detailsUrl), { method: 'GET', headers });
                    const poDetail = await detailsRes.json();
                    setPoDetailRaw(poDetail);

                    const resolvedStock = await fetchStocksByStore(finalPo.storeId || storeId, headers);

                    setCurrentStep(3);
                    const poData = poDetail.data || poDetail;
                    const mappedItems = (poData.items || []).map(item => ({
                        id: item.id,
                        productId: item.productId,
                        productName: item.productName || item.product?.name || "Sản phẩm",
                        unitId: item.unitId || item.unit?.id || 18,
                        unitName: item.unitName || item.unit?.name || 'Đơn vị',
                        quantity: item.quantity || item.orderQuantity || 0,
                        sku: item.sku || item.product?.sku || '',
                        orderQuantity: item.orderQuantity || item.quantity || 0
                    }));

                    const autoPayload = {
                        organizationId: parseInt(orgId),
                        storeId: poData.storeId || parseInt(storeId),
                        movementTypeId: parseInt(movementTypeId),
                        docDate: invoiceDate,
                        docNumber: "",
                        supplierId: poData.supplierId || 187,
                        stockId: parseInt(resolvedStock || stockId || "2"),
                        docStatus: 1,
                        notes: notes || poData.notes || "",
                        items: mappedItems,
                        docRefs: [{ docId: poId, docType: "PurchaseOrder", docTypeId: 22, docNumber: poData.docNumber || poNumberInput }],
                        inputType: parseInt(inputType),
                        idempotencyKey: crypto.randomUUID()
                    };

                    setGeneratedPayload(autoPayload);
                    addLog(`Tạo Payload thành công! Hãy duyệt và gửi lên hệ thống.`, 'success');
                } catch (err) {
                    addLog(`Lỗi: ${err.message}`, 'error');
                }
            };

            const submitSingleGoodsReceipt = async () => {
                if (!generatedPayload) return;
                setCurrentStep(4);
                addLog(`[Bước 4] Gửi POST tạo phiếu nhập hàng...`, 'info');
                try {
                    const postUrl = `${baseUrl}/goods-receipts?orgId=${orgId}&lang=${lang}&v=${version}`;
                    const response = await fetch(getProxyUrl(postUrl), {
                        method: 'POST',
                        headers: { ...parseHeaders(), 'content-type': 'application/json' },
                        body: JSON.stringify(generatedPayload)
                    });
                    const resJson = await response.json();
                    setResponseResult({ status: response.status, data: resJson });
                    if (response.ok && resJson.success !== false) {
                        addLog(`Tạo thành công phiếu nhập hàng!`, 'success');
                    } else {
                        addLog(`Tạo thất bại: ${resJson.message}`, 'error');
                    }
                } catch (e) {
                    addLog(`Lỗi kết nối: ${e.message}`, 'error');
                } finally {
                    setCurrentStep(3);
                }
            };

            const parseManualPo = () => {
                try {
                    const parsed = JSON.parse(manualPoJson);
                    const poData = parsed.data || parsed;
                    const manualPayload = {
                        organizationId: parseInt(orgId),
                        storeId: poData.storeId || 3354,
                        movementTypeId: parseInt(movementTypeId),
                        docDate: invoiceDate,
                        docNumber: "",
                        supplierId: poData.supplierId || 187,
                        stockId: parseInt(stockId || "2"),
                        docStatus: 1,
                        notes: notes || poData.notes || "",
                        items: (poData.items || []).map(item => ({
                            id: item.id || 0,
                            productId: item.productId,
                            productName: item.productName || "Sản phẩm",
                            unitId: item.unitId || 18,
                            unitName: item.unitName || "Đơn vị",
                            quantity: item.quantity || item.orderQuantity || 1,
                            sku: item.sku || "",
                            orderQuantity: item.orderQuantity || item.quantity || 1
                        })),
                        docRefs: [{ docId: poData.id || 0, docType: "PurchaseOrder", docTypeId: 22, docNumber: poData.docNumber || poNumberInput }],
                        inputType: parseInt(inputType),
                        idempotencyKey: crypto.randomUUID()
                    };
                    setManualResultJson(JSON.stringify(manualPayload, null, 2));
                } catch (e) {
                    showNotify("JSON không hợp lệ!", "error");
                }
            };

            // Calculate stats for Batch Mode
            const batchStats = {
                total: batchTasks.length,
                pending: batchTasks.filter(t => t.status === 'pending').length,
                processing: batchTasks.filter(t => t.status === 'processing').length,
                success: batchTasks.filter(t => t.status === 'success').length,
                failed: batchTasks.filter(t => t.status === 'failed').length,
            };


            const updateGrStats = {
                total: updateGrTasks.length,
                pending: updateGrTasks.filter(t => t.status === 'pending').length,
                processing: updateGrTasks.filter(t => t.status === 'processing').length,
                success: updateGrTasks.filter(t => t.status === 'success').length,
                failed: updateGrTasks.filter(t => t.status === 'failed').length,
            };

            return (
                <div class="min-h-screen flex flex-col bg-slate-900 text-slate-100 selection:bg-indigo-500 selection:text-white">
                    {/* Header */}
                    <header class="bg-slate-950 border-b border-slate-800 shrink-0 px-6 py-4 flex items-center justify-between shadow-lg">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-indigo-500/20 shadow-md">
                                <Icon name="package-plus" className="w-5 h-5" />
                            </div>
                            <div>
                                <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                    DCorp SH2 <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2.5 py-0.5 rounded-full font-medium border border-indigo-500/30">Auto PO Receiver</span>
                                </h1>
                                <p class="text-xs text-slate-400">Chuyển đổi Đơn hàng (PO) thành Phiếu Nhập hàng (Goods Receipt) hàng loạt</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button 
                                onClick={() => setActiveTab('batch')} 
                                class={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${activeTab === 'batch' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/10' : 'text-slate-300 hover:bg-slate-800'}`}
                            >
                                <Icon name="layers" className="w-4 h-4" /> Nhận Hàng Loạt (Batch)
                            </button>
                            <button 
                                onClick={() => setActiveTab('automation')} 
                                class={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${activeTab === 'automation' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/10' : 'text-slate-300 hover:bg-slate-800'}`}
                            >
                                <Icon name="zap" className="w-4 h-4" /> Nhận Đơn Lẻ (Single)
                            </button>
                            <button 
                                onClick={() => setActiveTab('manual-parser')} 
                                class={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${activeTab === 'manual-parser' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/10' : 'text-slate-300 hover:bg-slate-800'}`}
                            >
                                <Icon name="file-json" className="w-4 h-4" /> Chuyển JSON Thủ Công
                            </button>
                            <button 
                                onClick={() => setActiveTab('update-gr')} 
                                class={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${activeTab === 'update-gr' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/10' : 'text-slate-300 hover:bg-slate-800'}`}
                            >
                                <Icon name="calendar" className="w-4 h-4" /> Cập nhật GR
                            </button>
                            <button 
                                onClick={() => setActiveTab('settings')} 
                                class={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-2 ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/10' : 'text-slate-300 hover:bg-slate-800'}`}
                            >
                                <Icon name="settings" className="w-4 h-4" /> Cấu Hình Headers / API
                            </button>
                        </div>
                    </header>

                    {/* Notification Toast */}
                    {notification && (
                        <div class="fixed top-5 right-5 z-50 animate-bounce">
                            <div class={`px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm font-medium border ${
                                notification.type === 'success' 
                                    ? 'bg-emerald-950/90 text-emerald-300 border-emerald-500/40' 
                                    : notification.type === 'error'
                                    ? 'bg-rose-950/90 text-rose-300 border-rose-500/40'
                                    : 'bg-indigo-950/90 text-indigo-300 border-indigo-500/40'
                            }`}>
                                <Icon name={notification.type === 'success' ? 'check-circle' : notification.type === 'error' ? 'alert-triangle' : 'info'} className="w-5 h-5 shrink-0" />
                                <span>{notification.message}</span>
                            </div>
                        </div>
                    )}

                    <div class="flex-1 flex overflow-hidden">
                        
                        {/* Tab: BATCH MODE (NHẬN HÀNG LOẠT) */}
                        {activeTab === 'batch' && (
                            <div class="flex-1 flex flex-col xl:flex-row overflow-hidden">
                                {/* Left column: Data Inputs */}
                                <div class="w-full xl:w-5/12 bg-slate-900 border-r border-slate-800 p-6 overflow-y-auto space-y-6 flex flex-col justify-between">
                                    <div class="space-y-6">
                                        <div class="border-b border-slate-800 pb-3">
                                            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                                                <span class="w-6 h-6 rounded-md bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xs">1</span>
                                                Dán danh sách PO & Ngày hóa đơn từ Excel
                                            </h2>
                                            <p class="text-xs text-slate-400 mt-1">Copy bảng 2 cột từ Excel/Google Sheets (Số PO, Ngày) rồi dán vào đây.</p>
                                        </div>

                                        <div>
                                            <textarea
                                                rows="10"
                                                value={batchInputText}
                                                onChange={(e) => setBatchInputText(e.target.value)}
                                                placeholder="PO-STG0004078&#9;12/05/2026&#10;PO-STG0004079&#9;13/05/2026"
                                                class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 custom-scrollbar"
                                            ></textarea>
                                            <div class="flex justify-between items-center mt-2">
                                                <span class="text-[10px] text-slate-500 italic">Mẹo: Cột ngày hỗ trợ định dạng DD/MM/YYYY hoặc YYYY-MM-DD</span>
                                                <button
                                                    onClick={handleParseBatchInput}
                                                    class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-all flex items-center gap-1.5 shadow-md shadow-indigo-600/10"
                                                >
                                                    <Icon name="refresh-cw" className="w-3.5 h-3.5" /> Nạp danh sách (Parse)
                                                </button>
                                            </div>
                                        </div>

                                        <div class="border-b border-slate-800 pb-3 pt-2">
                                            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                                                <span class="w-6 h-6 rounded-md bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xs">2</span>
                                                Tham số thực thi hàng loạt
                                            </h2>
                                        </div>

                                        <div class="grid grid-cols-2 gap-4">
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-400 mb-1">Độ trễ giãn cách (Delay ms)</label>
                                                <input 
                                                    type="number" 
                                                    value={batchDelay}
                                                    onChange={(e) => setBatchDelay(Math.max(200, parseInt(e.target.value) || 0))}
                                                    class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white font-mono"
                                                    placeholder="1000"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-400 mb-1">Mã Hướng Nhập (Type)</label>
                                                <input 
                                                    type="text" 
                                                    value={inputType} 
                                                    onChange={(e) => setInputType(e.target.value)}

                                        ) : (
                                            <div class="h-full flex flex-col items-center justify-center py-20 text-center max-w-xl mx-auto space-y-4">
                                                <div class="w-16 h-16 rounded-2xl bg-indigo-600/10 text-indigo-400 flex items-center justify-center">
                                                    <Icon name="cpu" className="w-8 h-8 animate-pulse" />
                                                </div>
                                                <div>
                                                    <h3 class="text-base font-bold text-white">Chưa xử lý đơn hàng</h3>
                                                    <p class="text-xs text-slate-400 mt-1">Cấu hình tham số và bấm nút Bắt đầu để chuẩn bị phiếu nhập đơn lẻ.</p>
                                                </div>
                                            </div>
                                        )}

                                        {/* Log Terminal */}
                                        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden mt-6">
                                            <div class="p-4 bg-slate-950 font-mono text-xs h-40 overflow-y-auto custom-scrollbar space-y-1">
                                                {stepLogs.map((log, index) => (
                                                    <div key={index} class="flex items-start space-x-2">
                                                        <span class="text-slate-600 shrink-0">[{log.timestamp}]</span>
                                                        <span class={log.type === 'success' ? 'text-emerald-400' : log.type === 'error' ? 'text-rose-400' : 'text-slate-300'}>{log.message}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}


                        {/* Tab: UPDATE GR BATCH */}
                        {activeTab === 'update-gr' && (
                            <div class="flex-1 flex flex-col xl:flex-row overflow-hidden">
                                <div class="w-full xl:w-5/12 bg-slate-900 border-r border-slate-800 p-6 overflow-y-auto space-y-6 flex flex-col justify-between">
                                    <div class="space-y-6">
                                        <div class="border-b border-slate-800 pb-3">
                                            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                                                <span class="w-6 h-6 rounded-md bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xs">1</span>
                                                Dán danh sách GR ID & Ngày cần đổi
                                            </h2>
                                            <p class="text-xs text-slate-400 mt-1">Dữ liệu gồm 2 cột: ID Phiếu Nhập và Ngày chứng từ mới.</p>
                                        </div>

                                        <div>
                                            <textarea
                                                rows="10"
                                                value={updateGrBatchText}
                                                onChange={(e) => setUpdateGrBatchText(e.target.value)}
                                                placeholder="148356\t12/05/2026\n148357\t13/05/2026"
                                                class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 custom-scrollbar"
                                            ></textarea>
                                            <div class="flex justify-between items-center mt-2">
                                                <span class="text-[10px] text-slate-500 italic">Định dạng hỗ trợ: DD/MM/YYYY hoặc YYYY-MM-DD</span>
                                                <button
                                                    onClick={handleParseUpdateGrBatch}
                                                    class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-all flex items-center gap-1.5 shadow-md shadow-indigo-600/10"
                                                >
                                                    <Icon name="refresh-cw" className="w-3.5 h-3.5" /> Nạp danh sách
                                                </button>
                                            </div>
                                        </div>

                                        <div class="border-b border-slate-800 pb-3 pt-2">
                                            <h2 class="text-base font-semibold text-white flex items-center gap-2">
                                                <span class="w-6 h-6 rounded-md bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xs">2</span>
                                                Tham số chạy
                                            </h2>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Độ trễ giãn cách (Delay ms)</label>
                                            <input 
                                                type="number" 
                                                value={updateGrDelay}
                                                onChange={(e) => setUpdateGrDelay(Math.max(200, parseInt(e.target.value) || 0))}
                                                class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white font-mono"
                                                placeholder="1000"
                                            />
                                        </div>
                                    </div>

                                    <div class="pt-6 border-t border-slate-800 flex gap-3">
                                        <button 
                                            onClick={runUpdateGrBatch}
                                            disabled={isUpdateGrBatchRunning || updateGrTasks.length === 0}
                                            class="flex-1 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white py-3 px-4 rounded-xl font-bold shadow-lg shadow-indigo-600/25 flex items-center justify-center space-x-2 transition-all disabled:opacity-50 disabled:pointer-events-none"
                                        >
                                            <Icon name="play" className="w-5 h-5" />
                                            <span>CHẠY CẬP NHẬT</span>
                                        </button>

                                        {isUpdateGrBatchRunning && (
                                            <button 
                                                onClick={stopUpdateGrBatch}
                                                class="bg-rose-600 hover:bg-rose-500 text-white py-3 px-4 rounded-xl font-bold flex items-center justify-center space-x-2 transition-all"
                                            >
                                                <Icon name="pause" className="w-5 h-5" />
                                                <span>DỪNG</span>
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <div class="flex-1 bg-slate-950 flex flex-col overflow-hidden">
                                    <div class="bg-slate-900 border-b border-slate-800 p-5">
                                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                            <div>
                                                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                                                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                                                    Tiến độ cập nhật
                                                </h3>
                                            </div>

                                            <div class="flex items-center gap-2">
                                                <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg">Tổng: <b>{updateGrStats.total}</b></span>
                                                <span class="text-xs bg-indigo-950/40 text-indigo-400 px-2.5 py-1 rounded-lg border border-indigo-500/20">Chạy: <b>{updateGrStats.processing}</b></span>
                                                <span class="text-xs bg-emerald-950/40 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/20">Thành công: <b>{updateGrStats.success}</b></span>
                                                <span class="text-xs bg-rose-950/40 text-rose-400 px-2.5 py-1 rounded-lg border border-rose-500/20">Lỗi: <b>{updateGrStats.failed}</b></span>
                                            </div>
                                        </div>

                                        {updateGrTasks.length > 0 && (
                                            <div class="w-full bg-slate-950 rounded-full h-2 mt-4 overflow-hidden border border-slate-800">
                                                <div 
                                                    class="bg-indigo-500 h-full transition-all duration-300"
                                                    style={{ width: `${((updateGrStats.success + updateGrStats.failed) / updateGrStats.total) * 100}%` }}
                                                ></div>
                                            </div>
                                        )}
                                    </div>

                                    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                                        <div class="w-full md:w-7/12 border-r border-slate-800 overflow-y-auto custom-scrollbar">
                                            <table class="w-full text-left border-collapse">
                                                <thead>
                                                    <tr class="border-b border-slate-800 text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-950/40 sticky top-0 z-10">
                                                        <th class="p-3">#</th>
                                                        <th class="p-3">GR ID</th>
                                                        <th class="p-3">Ngày mới</th>
                                                        <th class="p-3">Tiến trình</th>
                                                        <th class="p-3 text-right">Trạng thái</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-800/40 text-xs">
                                                    {updateGrTasks.length === 0 ? (
                                                        <tr><td colSpan="5" class="p-8 text-center text-slate-600">Chưa có dữ liệu nào được nạp.</td></tr>
                                                    ) : (
                                                        updateGrTasks.map((task, idx) => (
                                                            <tr 
                                                                key={task.id} 
                                                                onClick={() => setSelectedUpdateGrTaskIndex(idx)}
                                                                class={`hover:bg-slate-800/20 transition-colors cursor-pointer ${selectedUpdateGrTaskIndex === idx ? 'bg-indigo-950/20 border-l-2 border-indigo-500' : ''}`}
                                                            >
                                                                <td class="p-3 text-slate-500 font-mono">{task.id}</td>
                                                                <td class="p-3 font-semibold text-slate-200">{task.grId}</td>
                                                                <td class="p-3">{task.docDate}</td>
                                                                <td class="p-3 text-slate-400 font-mono">{task.progressStep}</td>
                                                                <td class="p-3 text-right">
                                                                    <span class={`inline-block px-2 py-0.5 rounded-full font-bold text-[10px] ${
                                                                        task.status === 'success' ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/20' :
                                                                        task.status === 'failed' ? 'bg-rose-950 text-rose-400 border border-rose-500/20' :
                                                                        task.status === 'processing' ? 'bg-indigo-950 text-indigo-400 border border-indigo-500/20' :
                                                                        'bg-slate-900 text-slate-500'
                                                                    }`}>
                                                                        {task.status === 'success' ? 'Thành công' :
                                                                         task.status === 'failed' ? 'Lỗi' :
                                                                         task.status === 'processing' ? 'Đang chạy' :
                                                                         'Chờ xử lý'}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div class="flex-1 bg-slate-950/80 p-5 overflow-y-auto custom-scrollbar flex flex-col justify-between">
                                            {selectedUpdateGrTaskIndex !== null && updateGrTasks[selectedUpdateGrTaskIndex] ? (
                                                <div class="space-y-4">
                                                    <div class="border-b border-slate-800 pb-3">
                                                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Chi tiết cập nhật #{updateGrTasks[selectedUpdateGrTaskIndex].id}</h4>
                                                        <p class="text-sm font-semibold text-white mt-1">GR ID: {updateGrTasks[selectedUpdateGrTaskIndex].grId}</p>
                                                    </div>
                                                    
                                                    <div class="space-y-2">
                                                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Log chi tiết:</span>
                                                        <div class="p-3 rounded-lg bg-slate-900 border border-slate-800/80 text-xs font-mono text-slate-300 min-h-[60px]">
                                                            {updateGrTasks[selectedUpdateGrTaskIndex].message || "Không có lỗi nào."}
                                                        </div>
                                                    </div>
                                                    
                                                    {updateGrTasks[selectedUpdateGrTaskIndex].payload && (
                                                        <div class="space-y-2">
                                                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">JSON Payload:</span>
                                                            <pre class="p-3 bg-slate-900 rounded-lg border border-slate-800 text-[10px] text-emerald-400 overflow-x-auto max-h-[160px] custom-scrollbar">
                                                                {JSON.stringify(updateGrTasks[selectedUpdateGrTaskIndex].payload, null, 2)}
                                                            </pre>
                                                        </div>
                                                    )}
                                                </div>
                                            ) : (
                                                <div class="h-full flex flex-col items-center justify-center text-slate-600 text-center">
                                                    <Icon name="terminal" className="w-8 h-8 mb-2 opacity-40" />
                                                    <p class="text-xs">Chọn dòng để xem chi tiết.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}



                        {/* Tab: MANUAL CONVERTER */}
                        {activeTab === 'manual-parser' && (
                            <div class="flex-1 p-6 overflow-y-auto space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div class="space-y-4">
                                        <label class="block text-xs font-semibold uppercase text-slate-400">1. Dán JSON chi tiết PO</label>
                                        <textarea 
                                            rows="15"
                                            value={manualPoJson}
                                            onChange={(e) => setManualPoJson(e.target.value)}
                                            placeholder="Dán JSON từ API DCorp..."
                                            class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-indigo-300 focus:outline-none custom-scrollbar"
                                        ></textarea>
                                        <button onClick={parseManualPo} class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold text-xs">Ánh Xạ Ngay</button>
                                    </div>

                                    <div class="space-y-4">
                                        <label class="block text-xs font-semibold uppercase text-slate-400">2. Kết quả Payload</label>
                                        <textarea 
                                            rows="15"
                                            readOnly
                                            value={manualResultJson}
                                            class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-emerald-400 focus:outline-none custom-scrollbar"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>
                        )}


                        {/* Tab: SETTINGS */}
                        {activeTab === 'settings' && (
                            <div class="flex-1 p-6 overflow-y-auto space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                                        <h4 class="text-sm font-semibold text-white border-b border-slate-800 pb-2">Tham số Kết nối API</h4>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">CORS Proxy (Cần bật nếu bị lỗi chặn CORS mạng nội bộ)</label>
                                            <div class="flex items-center space-x-2 mt-2">
                                                <input type="checkbox" id="cors-toggle" checked={useCorsProxy} onChange={(e) => setUseCorsProxy(e.target.checked)} class="rounded text-indigo-600 bg-slate-950 border-slate-800" />
                                                <label htmlFor="cors-toggle" class="text-xs font-medium text-slate-300">Bật CORS Proxy</label>
                                            </div>
                                            {useCorsProxy && (
                                                <input type="text" value={corsProxyUrl} onChange={(e) => setCorsProxyUrl(e.target.value)} class="block w-full mt-2 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono" />
                                            )}
                                        </div>

                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Base URL API</label>
                                            <input type="text" value={baseUrl} onChange={(e) => setBaseUrl(e.target.value)} class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-white" />
                                        </div>

                                        <div class="grid grid-cols-3 gap-4">
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-400 mb-1">Organization ID</label>
                                                <input type="text" value={orgId} onChange={(e) => setOrgId(e.target.value)} class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono" />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-400 mb-1">Phiên bản (v)</label>
                                                <input type="text" value={version} onChange={(e) => setVersion(e.target.value)} class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono" />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-400 mb-1">Ngôn ngữ</label>
                                                <input type="text" value={lang} onChange={(e) => setLang(e.target.value)} class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono" />
                                            </div>
                                        </div>
                                    </div>

                                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                            <h4 class="text-sm font-semibold text-white flex items-center gap-1.5">
                                                <Icon name="key" className="w-4 h-4 text-indigo-400" /> Token Xác Thực DCorp
                                            </h4>
                                            {apiToken.trim() ? <span class="text-[9px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded font-bold">Hoạt động</span> : <span class="text-[9px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded font-bold">Chưa có</span>}
                                        </div>
                                        <textarea 
                                            rows="4" 
                                            value={apiToken} 
                                            onChange={(e) => setApiToken(e.target.value)} 
                                            placeholder="Dán token Bearer JWT vào đây..." 
                                            class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-300 custom-scrollbar"
                                        />
                                        <textarea 
                                            rows="4" 
                                            value={customHeadersText} 
                                            onChange={(e) => setCustomHeadersText(e.target.value)} 
                                            class="block w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-300 custom-scrollbar"
                                        />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer class="bg-slate-950 border-t border-slate-800 px-6 py-3 text-center shrink-0 flex items-center justify-between text-xs text-slate-500">
                        <span>Thiết bị Tự động hóa ánh xạ dữ liệu DCorp PO ➔ Goods Receipt v2.0 (Batch Mode)</span>
                        <span class="flex items-center gap-1"><Icon name="shield-check" className="w-4 h-4 text-emerald-500" /> Cục bộ & Bảo mật</span>
                    </footer>
                </div>
            );
        }

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
